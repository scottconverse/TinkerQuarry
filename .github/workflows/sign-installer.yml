name: Sign installer

# Signs a release installer with Azure Trusted Signing. For a real release, the
# unsigned input is downloaded from the successful release-gate run at the tag's
# exact commit (never from an unproven public asset), Azure signs it with its
# HSM-held key, and the workflow verifies, re-hashes, publishes, re-downloads,
# and verifies the exact public bytes. Checksums are regenerated AFTER signing
# because signing changes the file hash.
#
# Run with no tag to smoke-test the signing chain: it signs a scratch exe and
# touches no release.

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Release tag holding the unsigned installer (e.g. v1.5.0). Leave empty for a smoke test that signs a scratch exe and touches no release."
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: sign-installer-${{ inputs.release-tag || github.run_id }}
  cancel-in-progress: false

jobs:
  # Gate finding TEST-2: v1.5.0 was built, signed and published without the full release
  # proof ever having run in Actions — release-gate.yml was workflow_dispatch-only and had
  # zero runs, ever. Signing is the last point where that is still catchable, so it is
  # caught here: no successful release-gate run at this tag's exact commit, no signature.
  #
  # There is deliberately no override input. The escape hatch is the correct route: run
  # release-gate.yml against the tag (it also runs automatically on every `v*` tag push),
  # wait for it to go green, then sign.
  release-gate-proof:
    name: Release gate passed at this tag's commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag_commit_sha: ${{ steps.proof.outputs.tag_commit_sha }}
      release_gate_url: ${{ steps.proof.outputs.release_gate_url }}
      release_gate_run_id: ${{ steps.proof.outputs.release_gate_run_id }}
      release_gate_run_attempt: ${{ steps.proof.outputs.release_gate_run_attempt }}
    steps:
      - name: Require a successful release-gate run at the tag's exact commit
        id: proof
        # Skipped for the no-tag smoke test, which signs a scratch exe and touches no release.
        if: inputs.release-tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.release-tag }}
        run: |
          set -uo pipefail
          # Deliberately NOT `set -e`: every failure below must exit through an explicit
          # branch that prints why. Under `set -e` a failing `gh api` inside a command
          # substitution kills the script before its own error message is emitted, which
          # turns "this tag is unproven" into an unexplained red X.

          runs_url="repos/$REPO/actions/workflows/release-gate.yml/runs?head_sha=%s&per_page=100"

          if ! sha=$(gh api "repos/$REPO/commits/$TAG" --jq '.sha') || [ -z "$sha" ]; then
            echo "::error::Could not resolve tag '$TAG' to a commit in $REPO. Check the tag exists and was pushed."
            exit 1
          fi
          echo "tag $TAG -> commit $sha"

          # EVERY release tag in this repo is ANNOTATED, so the ref points at a tag OBJECT whose
          # sha differs from the commit's (v1.5.0: ref object 735d816f..., commit f3d3b903...).
          # `commits/$TAG` above dereferences to the commit. But release-gate.yml is triggered by
          # `push: tags: v*`, and it is NOT settled which of the two shas Actions records as a
          # tag-push run's head_sha — this repo has no tag-push run in its history to check
          # against, and guessing wrong makes this gate permanently unsatisfiable: no run would
          # ever match, so no release could ever be signed by the intended route.
          #
          # Rather than bet on the answer, accept a successful run at EITHER sha. Both identify
          # the same tag, so nothing is loosened: a run on some OTHER commit still fails.
          tag_obj=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null || echo "")
          if [ -n "$tag_obj" ] && [ "$tag_obj" != "$sha" ]; then
            echo "annotated tag: ref object $tag_obj dereferences to commit $sha; accepting either"
          fi

          # head_sha pins the answer to THIS tag. A green release-gate run on some other
          # commit — main, a branch, last week's tag — proves nothing about what is about to
          # be signed, which is exactly how a stale proof would sneak through.
          runs=0
          proof_url=""
          proof_run_id=""
          proof_run_attempt=""
          diagnostics=""
          candidates="$sha"
          if [ -n "$tag_obj" ] && [ "$tag_obj" != "$sha" ]; then
            candidates="$candidates $tag_obj"
          fi
          for candidate in $candidates; do
            # shellcheck disable=SC2059
            url=$(printf "$runs_url" "$candidate")
            if ! run_json=$(gh api "$url"); then
              echo "::error::Could not query release-gate.yml runs for $candidate. Refusing to sign an installer whose release proof cannot be confirmed."
              exit 1
            fi
            n=$(jq '[.workflow_runs[] | select(.conclusion == "success")] | length' <<< "$run_json")
            echo "successful release-gate runs at $candidate: $n"
            runs=$((runs + n))
            summary=$(jq -r '.workflow_runs[] | "  \(.status)/\(.conclusion // "pending")  \(.html_url)"' <<< "$run_json")
            if [ -z "$summary" ]; then
              summary="  <none>"
            fi
            diagnostics="${diagnostics}
          candidate $candidate:
          $summary"
            if [ "$n" -gt 0 ] && [ -z "$proof_url" ]; then
              latest=$(jq -c '[.workflow_runs[] | select(.conclusion == "success")] | sort_by(.created_at) | reverse | .[0]' <<< "$run_json")
              proof_url=$(jq -r '.html_url' <<< "$latest")
              proof_run_id=$(jq -r '.id | tostring' <<< "$latest")
              proof_run_attempt=$(jq -r '.run_attempt | tostring' <<< "$latest")
            fi
          done
          echo "successful release-gate runs for tag $TAG (either sha): $runs"

          if [ "$runs" -eq 0 ]; then
            echo "::error::No successful release-gate.yml run exists for $TAG ($sha). This installer has NOT been release-proven: the full pnpm test:release lane (Rust tests, cargo audit, Playwright, the full engine pytest, the native build and both installed-binary smoke tests) has not passed on this commit. Refusing to sign."
            echo "release-gate runs found at this commit (if any):"
            printf '%s\n' "$diagnostics"
            echo "Fix: run the 'Release Gate' workflow against $TAG, wait for it to go green, then re-run this."
            exit 1
          fi

          if [ -z "$proof_url" ] || [ "$proof_url" = "null" ] || [ -z "$proof_run_id" ] || [ "$proof_run_id" = "null" ] || [ -z "$proof_run_attempt" ] || [ "$proof_run_attempt" = "null" ]; then
            echo "::error::A successful release-gate run was counted but its URL/ID/attempt could not be resolved. Refusing to emit an untraceable proof."
            exit 1
          fi

          {
            echo "tag_commit_sha=$sha"
            echo "release_gate_url=$proof_url"
            echo "release_gate_run_id=$proof_run_id"
            echo "release_gate_run_attempt=$proof_run_attempt"
          } >> "$GITHUB_OUTPUT"
          echo "release-gate proof found for $TAG ($sha): run $proof_run_id attempt $proof_run_attempt, $proof_url"

  sign:
    needs: release-gate-proof
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      # Standing rule (all repos): prove the service-principal secret is valid in
      # seconds, before any longer work, by hitting the AAD token endpoint directly.
      - name: Azure token preflight (fail fast)
        shell: pwsh
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          $body = @{
            client_id     = $env:CLIENT_ID
            client_secret = $env:CLIENT_SECRET
            grant_type    = 'client_credentials'
            scope         = 'https://codesigning.azure.net/.default'
          }
          try {
            Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$env:TENANT_ID/oauth2/v2.0/token" -Body $body -ErrorAction Stop | Out-Null
            Write-Host "Preflight token acquired."
          } catch {
            # Any structured AAD error response is a definitive config/credential
            # failure (bad secret, bad client id, bad tenant, ...) except AAD's one
            # transient code. Warn-and-continue is reserved for a response-less
            # network-level failure - the signing step is the real test there.
            $msg = "$($_.ErrorDetails.Message)"
            if ($msg -and $msg -notmatch 'temporarily_unavailable') {
              Write-Error "Azure credential preflight failed: $msg"
              exit 1
            }
            Write-Warning "Preflight inconclusive (no AAD response): $($_.Exception.Message) - continuing"
          }

      - name: Get file to sign
        id: get
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag }}
          PROOF_SHA: ${{ needs.release-gate-proof.outputs.tag_commit_sha }}
          PROOF_RUN_ID: ${{ needs.release-gate-proof.outputs.release_gate_run_id }}
          PROOF_RUN_ATTEMPT: ${{ needs.release-gate-proof.outputs.release_gate_run_attempt }}
          PROOF_URL: ${{ needs.release-gate-proof.outputs.release_gate_url }}
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          if ($env:TAG) {
            if (-not $env:PROOF_RUN_ID) {
              Write-Error "release-gate proof run ID is empty"
              exit 1
            }
            $run = gh api "repos/${{ github.repository }}/actions/runs/$env:PROOF_RUN_ID" | ConvertFrom-Json
            if (
              $LASTEXITCODE -ne 0 -or
              $run.conclusion -ne "success" -or
              "$($run.run_attempt)" -ne $env:PROOF_RUN_ATTEMPT -or
              $run.html_url -ne $env:PROOF_URL -or
              $run.head_sha -ne $env:PROOF_SHA
            ) {
              Write-Error "release-gate run identity changed after proof selection"
              exit 1
            }
            New-Item -ItemType Directory -Force artifacts\gate | Out-Null
            gh run download $env:PROOF_RUN_ID --repo ${{ github.repository }} --name tinkerquarry-windows-release-artifacts --dir artifacts\gate
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $exes = @(Get-ChildItem artifacts\gate -Recurse -Filter '*-setup.exe')
            if ($exes.Count -ne 1) {
              Write-Error "expected exactly 1 NSIS installer in release-gate run $env:PROOF_RUN_ID, found $($exes.Count) - refusing to guess which to sign"
              exit 1
            }
            $exe = $exes[0]

            gh release download $env:TAG --repo ${{ github.repository }} --pattern release-manifest.json --dir artifacts
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $manifest = Get-Content artifacts\release-manifest.json -Raw | ConvertFrom-Json
            $manifestEntry = @($manifest.artifacts | Where-Object { $_.file -eq $exe.Name })
            if ($manifest.commit -ne $env:PROOF_SHA -or $manifest.tag -ne $env:TAG) {
              Write-Error "public release manifest identity does not match the proven tag"
              exit 1
            }
            if ($manifestEntry.Count -ne 1) {
              Write-Error "release-gate installer '$($exe.Name)' is not the manifest's unique installer"
              exit 1
            }
          } else {
            Set-Content smoke.cs 'class Smoke { static void Main() {} }'
            $csc = Get-ChildItem "$env:WINDIR\Microsoft.NET\Framework64\v4*\csc.exe" | Select-Object -First 1
            & $csc.FullName /nologo /out:artifacts\smoke-test.exe smoke.cs
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $exe = Get-Item artifacts\smoke-test.exe
          }
          $unsignedHash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "exe_name=$($exe.Name)" >> $env:GITHUB_OUTPUT
          "unsigned_sha256=$unsignedHash" >> $env:GITHUB_OUTPUT

      - name: Sign with Azure Trusted Signing
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://wcus.codesigning.azure.net
          signing-account-name: scottconverse-signing
          certificate-profile-name: ScottConversePublic
          files: ${{ steps.get.outputs.exe }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signature
        id: signed
        shell: pwsh
        env:
          EXE: ${{ steps.get.outputs.exe }}
          EXPECTED_SIGNER_SUBJECT: "CN=Scott Converse, O=Scott Converse, L=Longmont, S=co, C=US"
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          $out = & $signtool.FullName verify /pa /v $env:EXE 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { Write-Error "signature verification failed"; exit 1 }
          # exit code alone does not prove a timestamp exists; require it explicitly
          if ($out -notmatch 'The signature is timestamped') {
            Write-Error "signature verified but no timestamp found - failing"
            exit 1
          }
          $signature = Get-AuthenticodeSignature $env:EXE
          $expectedIssuer = '^CN=Microsoft ID Verified CS EOC CA [0-9]+, O=Microsoft Corporation, C=US$'
          $expectedTimestampIssuer = '^CN=Microsoft Public RSA Timestamping CA 2020, O=Microsoft Corporation, C=US$'
          if (
            $signature.Status -ne [Management.Automation.SignatureStatus]::Valid -or
            $signature.SignerCertificate.Subject -ne $env:EXPECTED_SIGNER_SUBJECT -or
            $signature.SignerCertificate.Issuer -notmatch $expectedIssuer -or
            $null -eq $signature.TimeStamperCertificate -or
            $signature.TimeStamperCertificate.Issuer -notmatch $expectedTimestampIssuer
          ) {
            Write-Error "signature is valid but is not the expected Scott Converse Azure Trusted Signing identity/timestamp chain"
            exit 1
          }
          $signedHash = (Get-FileHash $env:EXE -Algorithm SHA256).Hash.ToLowerInvariant()
          "signed_sha256=$signedHash" >> $env:GITHUB_OUTPUT
          Write-Host "expected signer verified; exact signed SHA-256=$signedHash"

      - name: Re-hash and update release assets
        if: inputs.release-tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag }}
          EXE: ${{ steps.get.outputs.exe }}
          EXE_NAME: ${{ steps.get.outputs.exe_name }}
          PROOF_SHA: ${{ needs.release-gate-proof.outputs.tag_commit_sha }}
          PROOF_URL: ${{ needs.release-gate-proof.outputs.release_gate_url }}
          PROOF_RUN_ID: ${{ needs.release-gate-proof.outputs.release_gate_run_id }}
          PROOF_RUN_ATTEMPT: ${{ needs.release-gate-proof.outputs.release_gate_run_attempt }}
          SOURCE_UNSIGNED_SHA256: ${{ steps.get.outputs.unsigned_sha256 }}
          EXPECTED_SIGNED_SHA256: ${{ steps.signed.outputs.signed_sha256 }}
          EXPECTED_SIGNER_SUBJECT: "CN=Scott Converse, O=Scott Converse, L=Longmont, S=co, C=US"
          REPO: ${{ github.repository }}
        run: |
          function Resolve-ProvenTagCommit {
            $resolved = gh api "repos/$env:REPO/commits/$env:TAG" --jq .sha
            if ($LASTEXITCODE -ne 0 -or -not $resolved) {
              Write-Error "could not re-resolve release tag $env:TAG"
              exit 1
            }
            return ($resolved | Out-String).Trim()
          }

          $name = $env:EXE_NAME
          $hash = (Get-FileHash $env:EXE -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:EXPECTED_SIGNED_SHA256) {
            Write-Error "signed installer changed between signature verification and publication preparation"
            exit 1
          }

          gh release download $env:TAG --repo ${{ github.repository }} --pattern SHA256SUMS.txt --pattern release-manifest.json --dir artifacts --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # Exact filename-field match; anything but exactly one replaced line means
          # the release assets do not look like we expect - stop before uploading.
          $matched = 0
          $sums = Get-Content artifacts\SHA256SUMS.txt | ForEach-Object {
            if (($_ -split '\s+', 2)[1] -eq $name) { $matched++; "$hash  $name" } else { $_ }
          }
          if ($matched -ne 1) {
            Write-Error "expected exactly 1 SHA256SUMS.txt line for $name, matched $matched"
            exit 1
          }
          [IO.File]::WriteAllLines("$PWD\artifacts\SHA256SUMS.txt", $sums)

          $m = Get-Content artifacts\release-manifest.json -Raw | ConvertFrom-Json
          if ($m.commit -ne $env:PROOF_SHA) {
            Write-Error "release manifest commit '$($m.commit)' does not match proven tag commit '$env:PROOF_SHA'"
            exit 1
          }
          if ($m.tag -ne $env:TAG) {
            Write-Error "release manifest tag '$($m.tag)' does not match requested tag '$env:TAG'"
            exit 1
          }
          if (-not $env:PROOF_URL) {
            Write-Error "release-gate proof URL is empty"
            exit 1
          }
          if (-not $env:PROOF_RUN_ID -or -not $env:PROOF_RUN_ATTEMPT -or -not $env:SOURCE_UNSIGNED_SHA256) {
            Write-Error "release-gate run ID/attempt or gated unsigned hash is empty"
            exit 1
          }
          $signature = Get-AuthenticodeSignature $env:EXE
          $expectedIssuer = '^CN=Microsoft ID Verified CS EOC CA [0-9]+, O=Microsoft Corporation, C=US$'
          if (
            $signature.Status -ne [Management.Automation.SignatureStatus]::Valid -or
            $signature.SignerCertificate.Subject -ne $env:EXPECTED_SIGNER_SUBJECT -or
            $signature.SignerCertificate.Issuer -notmatch $expectedIssuer
          ) {
            Write-Error "expected signer identity did not survive release preparation"
            exit 1
          }
          $updated = 0
          foreach ($a in $m.artifacts) { if ($a.file -eq $name) { $a.sha256 = $hash; $updated++ } }
          if ($updated -ne 1) {
            Write-Error "expected exactly 1 release-manifest.json artifact entry for $name, updated $updated"
            exit 1
          }
          $m.unsigned_build = $false
          $m.release_gate = "GitHub Actions Release Gate passed for $env:PROOF_SHA`: $env:PROOF_URL"
          $m | Add-Member -NotePropertyName signing -NotePropertyValue ([pscustomobject]@{
            provider = "Azure Trusted Signing"
            digest = "SHA256"
            timestamp = "RFC3161/SHA256"
            authenticode_verified = $true
            timestamp_verified = $true
            release_gate_run_id = $env:PROOF_RUN_ID
            release_gate_run_attempt = [int]$env:PROOF_RUN_ATTEMPT
            release_gate_url = $env:PROOF_URL
            source_unsigned_sha256 = $env:SOURCE_UNSIGNED_SHA256
            signed_sha256 = $hash
            signer_subject = $signature.SignerCertificate.Subject
            signer_issuer = $signature.SignerCertificate.Issuer
            signer_thumbprint = $signature.SignerCertificate.Thumbprint
            signer_serial_number = $signature.SignerCertificate.SerialNumber
            signed_at = (Get-Date).ToUniversalTime().ToString("o")
          }) -Force
          [IO.File]::WriteAllText("$PWD\artifacts\release-manifest.json", ($m | ConvertTo-Json -Depth 5))

          $tagCommitBeforeUpload = Resolve-ProvenTagCommit
          if ($tagCommitBeforeUpload -ne $env:PROOF_SHA) {
            Write-Error "release tag moved before publication: expected $env:PROOF_SHA, got $tagCommitBeforeUpload"
            exit 1
          }
          gh release upload $env:TAG $env:EXE artifacts\SHA256SUMS.txt artifacts\release-manifest.json --repo ${{ github.repository }} --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "signed $name  sha256=$hash"

      - name: Verify exact published release assets
        if: inputs.release-tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag }}
          EXE_NAME: ${{ steps.get.outputs.exe_name }}
          PROOF_SHA: ${{ needs.release-gate-proof.outputs.tag_commit_sha }}
          PROOF_URL: ${{ needs.release-gate-proof.outputs.release_gate_url }}
          PROOF_RUN_ID: ${{ needs.release-gate-proof.outputs.release_gate_run_id }}
          PROOF_RUN_ATTEMPT: ${{ needs.release-gate-proof.outputs.release_gate_run_attempt }}
          SOURCE_UNSIGNED_SHA256: ${{ steps.get.outputs.unsigned_sha256 }}
          EXPECTED_SIGNED_SHA256: ${{ steps.signed.outputs.signed_sha256 }}
          EXPECTED_SIGNER_SUBJECT: "CN=Scott Converse, O=Scott Converse, L=Longmont, S=co, C=US"
          REPO: ${{ github.repository }}
        run: |
          function Resolve-ProvenTagCommit {
            $resolved = gh api "repos/$env:REPO/commits/$env:TAG" --jq .sha
            if ($LASTEXITCODE -ne 0 -or -not $resolved) {
              Write-Error "could not re-resolve release tag $env:TAG"
              exit 1
            }
            return ($resolved | Out-String).Trim()
          }

          $tagCommitAfterUpload = Resolve-ProvenTagCommit
          if ($tagCommitAfterUpload -ne $env:PROOF_SHA) {
            Write-Error "release tag moved during publication: expected $env:PROOF_SHA, got $tagCommitAfterUpload"
            exit 1
          }
          New-Item -ItemType Directory -Force published | Out-Null
          gh release download $env:TAG --repo ${{ github.repository }} --pattern '*-setup.exe' --pattern SHA256SUMS.txt --pattern release-manifest.json --dir published
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $publishedExes = @(Get-ChildItem published -Filter *.exe)
          if ($publishedExes.Count -ne 1 -or $publishedExes[0].Name -ne $env:EXE_NAME) {
            Write-Error "expected exactly the published installer '$env:EXE_NAME', found: $($publishedExes.Name -join ', ')"
            exit 1
          }
          $publishedExe = $publishedExes[0]
          $publishedHash = (Get-FileHash $publishedExe.FullName -Algorithm SHA256).Hash.ToLower()
          if ($publishedHash -ne $env:EXPECTED_SIGNED_SHA256) {
            Write-Error "published installer bytes differ from the exact locally verified signed bytes"
            exit 1
          }
          $publishedManifest = Get-Content published\release-manifest.json -Raw | ConvertFrom-Json
          $publishedEntry = @($publishedManifest.artifacts | Where-Object { $_.file -eq $publishedExe.Name })
          $publishedSum = @(Get-Content published\SHA256SUMS.txt | Where-Object { ($_ -split '\s+', 2)[1] -eq $publishedExe.Name })

          if ($publishedEntry.Count -ne 1 -or $publishedEntry[0].sha256 -ne $publishedHash) {
            Write-Error "published manifest hash does not match the published installer"
            exit 1
          }
          if ($publishedSum.Count -ne 1 -or ($publishedSum[0] -split '\s+', 2)[0] -ne $publishedHash) {
            Write-Error "published SHA256SUMS.txt does not match the published installer"
            exit 1
          }
          if ($publishedManifest.commit -ne $env:PROOF_SHA -or $publishedManifest.tag -ne $env:TAG) {
            Write-Error "published manifest identity does not match the proven tag"
            exit 1
          }
          if ($publishedManifest.unsigned_build -ne $false -or $publishedManifest.release_gate -notlike "*$env:PROOF_URL*") {
            Write-Error "published manifest does not carry the signed posture and exact release-gate proof URL"
            exit 1
          }
          if (
            $publishedManifest.signing.release_gate_run_id -ne $env:PROOF_RUN_ID -or
            "$($publishedManifest.signing.release_gate_run_attempt)" -ne $env:PROOF_RUN_ATTEMPT -or
            $publishedManifest.signing.release_gate_url -ne $env:PROOF_URL -or
            $publishedManifest.signing.source_unsigned_sha256 -ne $env:SOURCE_UNSIGNED_SHA256 -or
            $publishedManifest.signing.signed_sha256 -ne $env:EXPECTED_SIGNED_SHA256
          ) {
            Write-Error "published signing evidence does not identify the exact gated unsigned input"
            exit 1
          }

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          $out = & $signtool.FullName verify /pa /v $publishedExe.FullName 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { Write-Error "published installer signature verification failed"; exit 1 }
          if ($out -notmatch 'The signature is timestamped') {
            Write-Error "published installer signature verified but no timestamp was found"
            exit 1
          }
          $publishedSignature = Get-AuthenticodeSignature $publishedExe.FullName
          $expectedIssuer = '^CN=Microsoft ID Verified CS EOC CA [0-9]+, O=Microsoft Corporation, C=US$'
          $expectedTimestampIssuer = '^CN=Microsoft Public RSA Timestamping CA 2020, O=Microsoft Corporation, C=US$'
          if (
            $publishedSignature.Status -ne [Management.Automation.SignatureStatus]::Valid -or
            $publishedSignature.SignerCertificate.Subject -ne $env:EXPECTED_SIGNER_SUBJECT -or
            $publishedSignature.SignerCertificate.Issuer -notmatch $expectedIssuer -or
            $null -eq $publishedSignature.TimeStamperCertificate -or
            $publishedSignature.TimeStamperCertificate.Issuer -notmatch $expectedTimestampIssuer -or
            $publishedManifest.signing.signer_subject -ne $publishedSignature.SignerCertificate.Subject -or
            $publishedManifest.signing.signer_issuer -ne $publishedSignature.SignerCertificate.Issuer -or
            $publishedManifest.signing.signer_thumbprint -ne $publishedSignature.SignerCertificate.Thumbprint -or
            $publishedManifest.signing.signer_serial_number -ne $publishedSignature.SignerCertificate.SerialNumber
          ) {
            Write-Error "published installer signer is not the expected identity or does not match its manifest"
            exit 1
          }
          $tagCommitAfterVerification = Resolve-ProvenTagCommit
          if ($tagCommitAfterVerification -ne $env:PROOF_SHA) {
            Write-Error "release tag moved before publication verification closed"
            exit 1
          }
          Write-Host "published signed installer verified: $($publishedExe.Name) sha256=$publishedHash"
